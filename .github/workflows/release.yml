name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libwayland-dev \
            libdbus-1-dev libgl1-mesa-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp target/release/qr-frame.exe "dist/qr-frame-${{ github.ref_name }}-${{ matrix.name }}.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          tar -czf "dist/qr-frame-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" \
            -C target/release qr-frame

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./make_app.sh
          mkdir dist
          ditto -c -k --keepParent "QR Frame.app" "dist/qr-frame-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
