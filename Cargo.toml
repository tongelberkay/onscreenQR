[package]
name = "qr-frame"
version = "1.0.1"
edition = "2021"
description = "Lightweight always-on-top screen QR code scanner"

[dependencies]
# GUI — immediate mode, compiles to a lean native binary
egui = "0.31"

# Screen capture — pure Rust, uses DXGI on Windows
screenshots = "0.8"

# QR decoding — pure Rust ZXing port, no C++ / no DLL
rxing = { version = "0.5", default-features = false }

# Image processing for decode pre-processing variants
image = { version = "0.25", default-features = false, features = ["png"] }

# Clipboard
arboard = { version = "3", default-features = false }

eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

# Update check against GitHub Releases
ureq = { version = "2", default-features = false, features = ["tls"] }


[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
pipewire = "0.10"
pollster = "0.4"

# Windows: embed .ico into the .exe at build time
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# macOS / Linux: packaging via `cargo install cargo-bundle` then `cargo bundle --release`
[package.metadata.bundle]
name = "QR Frame"
identifier = "com.berkay.qr-frame"
icon = ["assets/icon.icns", "assets/icon.png"]
short_description = "Lightweight always-on-top screen QR code scanner"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
